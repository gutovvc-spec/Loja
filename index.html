<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minha Loja</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1b2333;--mu:#6b7280;--pr:#4f46e5;--ok:#16a34a;--rd:#dc2626;--bd:#e5e7eb;--soft:#eceef4}
[data-theme=dark]{color-scheme:dark;--bg:#0f1420;--card:#1a2132;--tx:#e8ecf5;--mu:#94a0b8;--pr:#6366f1;--bd:#2a3349;--soft:#262f45}
[data-theme=dark] .tag{background:#422f0a;color:#fcd34d}[data-theme=dark] .tag.pago{background:#0f3a24;color:#86efac}[data-theme=dark] .tag.cancelado{background:#452020;color:#fca5a5}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx)}
header{background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:12px 20px;flex-wrap:wrap}
header h1{font-size:1.2rem;margin:0;flex:1}
.btn{border:0;background:var(--pr);color:#fff;padding:10px 16px;border-radius:10px;font-size:.92rem;cursor:pointer}
.btn.g{background:var(--ok)}.btn.r{background:var(--rd)}.btn.l{background:var(--soft);color:var(--tx)}.btn.s{padding:6px 10px;font-size:.8rem}
main{max-width:1050px;margin:20px auto;padding:0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px}
.pimg{width:100%;height:150px;object-fit:cover;border-radius:10px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:2.5rem}
h3{margin:10px 0 2px;font-size:1rem}.price{font-weight:700;color:var(--pr)}.mu{color:var(--mu);font-size:.85rem}
.row{display:flex;align-items:center;gap:8px;margin-top:10px}
.qty{display:flex;align-items:center;border:1px solid var(--bd);border-radius:10px}
.qty button{border:0;background:none;color:var(--tx);width:32px;height:34px;font-size:1.1rem;cursor:pointer}.qty span{min-width:26px;text-align:center}
input,select,textarea{background:var(--card);color:var(--tx);width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;font:inherit;margin:4px 0 10px}
label{font-size:.85rem;color:var(--mu)}
.hide{display:none!important}
.bar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}.bar input,.bar select{margin:0;flex:1;min-width:140px}
.modal{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.box{background:var(--card);border-radius:16px;padding:22px;width:100%;max-width:430px;max-height:92vh;overflow:auto}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd);font-size:.92rem}
.tot{display:flex;justify-content:space-between;font-weight:700;font-size:1.15rem;margin:14px 0}
#qr{width:230px;margin:10px auto;display:block;background:#fff;padding:8px;border-radius:12px}#qr img{width:100%}
.tag{font-size:.75rem;padding:3px 9px;border-radius:99px;background:#fef3c7;color:#92400e}.tag.pago{background:#dcfce7;color:#166534}.tag.cancelado{background:#fee2e2;color:#991b1b}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1b2333;color:#fff;padding:10px 18px;border-radius:10px;z-index:20}
.center{text-align:center}
</style>
</head>
<body>
<header>
  <h1 id="brand">🛍️ Minha Loja</h1>
  <button class="btn" onclick="openCart()">🛒 Carrinho <b id="cnt">0</b></button>
  <button class="btn l" id="themeBtn" onclick="toggleTheme()">🌙</button>
</header>
<main>
  <div class="bar"><input id="q" placeholder="🔎 Buscar produto..." oninput="renderShop()"><select id="cat" onchange="renderShop()"></select></div>
  <div class="grid" id="shop"></div>
</main>
<div id="modal" class="modal hide"><div class="box" id="mbox"></div></div>

<script>
/* ===== Mesmo Supabase do painel admin: é ele que liga os dois sites ===== */
const SUPABASE_URL = 'https://ovejorngmiwhnreasqfl.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im92ZWpvcm5nbWl3aG5yZWFzcWZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3OTYxNTEsImV4cCI6MjEwNjM3MjE1MX0.xztwLgAYgwwCTtNB4Q7pTve3QLzDJVTHttSqnSrD8JE';
/* ======================================================================= */

/* ===== AVISO DE COMPRA NO SEU WHATSAPP (CallMeBot) =====
   phone: SEU número (quem recebe), DDI + DDD + número, só dígitos
   apikey: chave gerada pelo CallMeBot para o seu número */
const WHATS_CONFIG = { phone: '5546920016778', apikey: '7605800' };
/* ======================================================= */

const applyTheme=t=>{document.documentElement.dataset.theme=t;const b=document.getElementById('themeBtn');if(b)b.textContent=t==='dark'?'☀️':'🌙'};
function toggleTheme(){const t=document.documentElement.dataset.theme==='dark'?'light':'dark';try{localStorage.setItem('theme',t)}catch{}applyTheme(t)}
{let t;try{t=localStorage.getItem('theme')}catch{}applyTheme(t||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'))}
const $=id=>document.getElementById(id);
const money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toast=t=>{const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2500)};
const sb=(SUPABASE_URL&&SUPABASE_KEY&&window.supabase)?supabase.createClient(SUPABASE_URL,SUPABASE_KEY):null;

/* ---------- Dados (Supabase) ---------- */
const db={
  async list(t){const {data,error}=await sb.from(t).select('*').order('created_at',{ascending:false});if(error){toast(error.message);return []}return data},
  async insert(t,row){const {data,error}=await sb.from(t).insert(row).select().single();if(error){toast(error.message);return null}return data},
  async update(t,id,patch){await sb.from(t).update(patch).eq('id',id)},
  async getCfg(){const {data}=await sb.from('settings').select('data').eq('id',1).maybeSingle();return data?.data||{}}
};
let cfg={},products=[],cart={};

function modal(h){$('mbox').innerHTML=h;$('modal').classList.remove('hide')}
const closeModal=()=>$('modal').classList.add('hide');
$('modal').onclick=e=>{if(e.target===$('modal'))closeModal()};

/* ---------- LOJA ---------- */
const pimg=p=>p.image_url?`<img class="pimg" src="${esc(p.image_url)}" alt="" onerror="this.outerHTML='<div class=pimg>📦</div>'">`:'<div class="pimg">📦</div>';
function renderShop(){
  const cats=[...new Set(products.map(p=>p.category).filter(Boolean))],sel=$('cat').value;
  $('cat').innerHTML='<option value="">Todas as categorias</option>'+cats.map(c=>`<option ${c===sel?'selected':''}>${esc(c)}</option>`).join('');
  const q=$('q').value.toLowerCase(),c=$('cat').value;
  const L=products.filter(p=>(!c||p.category===c)&&(!q||(p.name+' '+(p.description||'')).toLowerCase().includes(q)));
  $('shop').innerHTML=L.length?L.map(p=>{const out=p.stock!=null&&p.stock<=0;return `<div class="card">${pimg(p)}<h3>${esc(p.name)}</h3>
    <div class="mu">${esc(p.description||'')}</div><div class="price">${money(p.price)}</div>
    ${out?'<div class="tag cancelado" style="margin-top:8px;display:inline-block">Esgotado</div>':`<div class="row"><div class="qty"><button onclick="chg('${p.id}',-1)">−</button><span id="q${p.id}">${cart[p.id]||0}</span><button onclick="chg('${p.id}',1)">+</button></div>
    <button class="btn" style="flex:1" onclick="chg('${p.id}',1);toast('Adicionado ✅')">Comprar</button></div>`}</div>`}).join(''):'<p class="mu">Nenhum produto encontrado.</p>';
  $('cnt').textContent=Object.values(cart).reduce((a,b)=>a+b,0);
}
function chg(id,d){const p=products.find(x=>x.id==id);let n=Math.max(0,(cart[id]||0)+d);if(p?.stock!=null&&n>p.stock){n=p.stock;toast('Limite de estoque')}
  n?cart[id]=n:delete cart[id];if($('q'+id))$('q'+id).textContent=n;$('cnt').textContent=Object.values(cart).reduce((a,b)=>a+b,0)}
const lines=()=>Object.entries(cart).map(([id,q])=>({p:products.find(x=>x.id==id),q})).filter(l=>l.p);
const total=()=>Math.round(lines().reduce((a,l)=>a+l.p.price*l.q,0)*100)/100;
function openCart(){
  const L=lines();
  if(!L.length)return modal('<h3>🛒 Carrinho vazio</h3><p class="mu">Escolha produtos na loja.</p><button class="btn l" onclick="closeModal()">Fechar</button>');
  modal(`<h3 style="margin-top:0">🛒 Seu carrinho</h3>${L.map(l=>`<div class="item"><span>${esc(l.p.name)}<br><span class="mu">${money(l.p.price)} cada</span></span>
    <span class="qty"><button onclick="chg('${l.p.id}',-1);openCart()">−</button><span>${l.q}</span><button onclick="chg('${l.p.id}',1);openCart()">+</button></span><b>${money(l.p.price*l.q)}</b></div>`).join('')}
  <div class="tot"><span>Total</span><span>${money(total())}</span></div>
  <label>Seu nome</label><input id="cn"><label>WhatsApp / telefone</label><input id="cp" placeholder="(00) 00000-0000"><label>E-mail (opcional)</label><input id="ce" type="email">
  <h4 style="margin:6px 0">📍 Endereço de entrega</h4>
  <label>CEP</label><input id="ad_cep" inputmode="numeric" maxlength="9" placeholder="00000-000" onblur="buscaCep()">
  <label>Rua</label><input id="ad_rua">
  <div style="display:flex;gap:8px"><div style="flex:1"><label>Número</label><input id="ad_num"></div><div style="flex:2"><label>Complemento</label><input id="ad_comp" placeholder="Apto, bloco..."></div></div>
  <label>Bairro</label><input id="ad_bai">
  <label>Cidade / UF</label><input id="ad_cid" placeholder="Ex: Curitiba - PR">
  <button class="btn g" style="width:100%" onclick="checkout()">Pagar com PIX</button>
  <button class="btn l" style="width:100%;margin-top:8px" onclick="closeModal()">Continuar comprando</button>`);
}
async function buscaCep(){
  const c=($('ad_cep').value||'').replace(/\D/g,'');if(c.length!==8)return;
  try{const d=await (await fetch('https://viacep.com.br/ws/'+c+'/json/')).json();
    if(!d.erro){$('ad_rua').value=d.logradouro||'';$('ad_bai').value=d.bairro||'';$('ad_cid').value=(d.localidade||'')+' - '+(d.uf||'');$('ad_num').focus()}}catch{}
}
async function checkout(){
  const name=$('cn').value.trim(),phone=$('cp').value.trim();
  if(!name||phone.length<8)return toast('Preencha nome e telefone');
  const g=id=>($(id)?.value||'').trim();
  if(!g('ad_rua')||!g('ad_num')||!g('ad_cid'))return toast('Preencha o endereço: rua, número e cidade');
  const address=`${g('ad_rua')}, ${g('ad_num')}${g('ad_comp')?' - '+g('ad_comp'):''}${g('ad_bai')?' - '+g('ad_bai'):''}, ${g('ad_cid')}${g('ad_cep')?' - CEP '+g('ad_cep'):''}`;
  if(!mpOn())return toast('Pagamento ainda não configurado pela loja');
  const L=lines(),amount=total(),email=($('ce')?.value||'').trim()||'cliente@email.com';
  modal('<p class="center">Gerando QR Code PIX…</p>');
  let pay;
  try{
    pay=await mp({action:'create',amount,description:L.map(l=>l.q+'x '+l.p.name).join(', ').slice(0,200),email});
    if(!pay?.point_of_interaction?.transaction_data)throw new Error(mpErr(pay));
  }catch(e){return modal(`<h3>Erro no pagamento</h3><p class="mu">${esc(e.message)}</p><button class="btn l" onclick="openCart()">Voltar</button>`)}
  const td=pay.point_of_interaction.transaction_data,payId=pay.id;
  const order=await db.insert('orders',{customer_name:name,customer_phone:phone,address,items:L.map(l=>({id:l.p.id,name:l.p.name,qty:l.q,price:l.p.price})),total:amount,payment_id:String(payId),status:'aguardando'});
  if(!order)return closeModal();
  const items=L.map(l=>({id:l.p.id,qty:l.q}));cur={order};
  cart={};renderShop();
  modal(`<h3 class="center" style="margin-top:0">Pague ${money(amount)} via PIX</h3>
    <div id="qr"><img src="data:image/png;base64,${td.qr_code_base64}" alt="QR PIX"></div>
    <p class="mu center">Escaneie no app do seu banco ou use o PIX copia e cola:</p>
    <textarea id="pc" readonly rows="3">${td.qr_code}</textarea>
    <button class="btn" style="width:100%;margin:6px 0" onclick="navigator.clipboard.writeText($('pc').value).then(()=>toast('Código copiado!'))">Copiar código PIX</button>
    <p class="mu center">Pedido #${String(order.id).slice(-5)} registrado. A confirmação é automática.</p>
    <p class="mu center" id="st">⏳ Aguardando pagamento…</p>
    ${testOn()?'<button class="btn" style="width:100%;margin-bottom:8px;background:#f59e0b" onclick="testPay()">🧪 Simular pagamento (TESTE)</button>':''}
    <button class="btn l" style="width:100%" onclick="closeModal()">Fechar</button>`);
  startPoll(payId,order.id,items);
}

/* ---------- Mercado Pago (sempre pela Edge Function) ---------- */
function mpErr(p){
  const c=(p?.cause||[]).map(x=>x.description||x.code).filter(Boolean).join(' | ');
  return [p?.message,c,p?.error,p?.status&&typeof p.status==='number'?'(HTTP '+p.status+')':''].filter(Boolean).join(' — ')||'Resposta vazia do Mercado Pago';
}
const mpOn=()=>!!cfg.mpFn;
async function mp(body){
  if(!cfg.mpFn)throw new Error('Pagamento ainda não configurado pela loja');
  let r,ctl,t;
  try{
    ctl=new AbortController();t=setTimeout(()=>ctl.abort(),20000);
    r=await fetch(cfg.mpFn,{method:'POST',signal:ctl.signal,headers:{'Content-Type':'application/json',Authorization:'Bearer '+SUPABASE_KEY,apikey:SUPABASE_KEY},body:JSON.stringify(body)});
  }catch(e){
    clearTimeout(t);
    if(e.name==='AbortError')throw new Error('A função demorou mais de 20s para responder. Veja os Logs dela no Supabase.');
    throw new Error('Não consegui acessar a Edge Function. Confira o nome na URL e se ela foi publicada (Deploy).');
  }
  clearTimeout(t);
  const txt=await r.text();let d;
  try{d=JSON.parse(txt)}catch{throw new Error('Resposta inválida (HTTP '+r.status+'): '+txt.slice(0,150))}
  if(!r.ok)throw new Error((d.message||d.msg||d.error||('Erro '+r.status))+(d.cause?.[0]?.description?' — '+d.cause[0].description:'')+' (HTTP '+r.status+')');
  return d;
}
let poll,cur=null;
function showPaid(o,test){
  modal(`<div class="center" style="padding:10px 0"><div style="font-size:2.6rem">✅</div>
    <h3 style="margin:8px 0">${test?'Pagamento simulado (teste)':'Pagamento confirmado!'}</h3>
    <p><b>📦 Seu pedido #${String(o.id).slice(-5)} está em preparação.</b></p>
    ${o.address?`<p class="mu">Entrega em:<br>${esc(o.address)}</p>`:''}
    <p class="mu">Obrigado pela compra!</p>
    <button class="btn" style="width:100%" onclick="closeModal()">Fechar</button></div>`);
}
const testOn=()=>cfg.testMode!==false;
async function decStock(items){for(const i of items){const p=products.find(x=>x.id==i.id);if(p&&p.stock!=null){p.stock=Math.max(0,p.stock-i.qty);await db.update('products',p.id,{stock:p.stock})}}}

/* ---------- Aviso no WhatsApp (CallMeBot) ---------- */
const wSent=new Set();
function notificarCompra(p){
  const linhas=[
    p.teste?'🧪 *TESTE: compra simulada*':'🛒 *Nova compra!*',
    p.pedido?'Pedido: #'+p.pedido:'',
    'Cliente: '+(p.cliente||'não informado'),
    p.telefone?'Telefone: '+p.telefone:'',
    'Itens: '+(p.itens||'não informado'),
    'Total: '+money(p.total),
    p.endereco?'Entrega: '+p.endereco:'',
    'Data: '+new Date().toLocaleString('pt-BR')
  ].filter(Boolean);
  const url='https://api.callmebot.com/whatsapp.php'+
    '?phone='+encodeURIComponent(WHATS_CONFIG.phone)+
    '&text='+encodeURIComponent(linhas.join('\n'))+
    '&apikey='+encodeURIComponent(WHATS_CONFIG.apikey);
  // no-cors: o navegador envia o pedido, mas não deixa a página ler a resposta
  return fetch(url,{mode:'no-cors'});
}
function avisarWhats(o,test){
  const k=o.id+(test?'-t':'');
  if(wSent.has(k))return;wSent.add(k); // evita aviso duplicado do mesmo pedido
  notificarCompra({teste:!!test,pedido:String(o.id).slice(-5),cliente:o.customer_name,telefone:o.customer_phone,
    itens:(o.items||[]).map(i=>i.qty+'x '+i.name).join(', '),total:o.total,endereco:o.address}).catch(()=>{});
}

async function notify(o,test){
  avisarWhats(o,test); // WhatsApp: dispara sempre que o pedido é pago (ou simulado)
  if(!cfg.mpFn)return{ok:false,msg:'configure a URL da Edge Function'};
  if(!test&&!o.payment_id)return{ok:false,msg:'sem pagamento'};
  try{await mp({action:'notify',test:!!test,payment_id:o.payment_id,customer:o.customer_name,phone:o.customer_phone,address:o.address,items:o.items,total:o.total});return{ok:true}}
  catch(e){return{ok:false,msg:e.message}}
}
async function testPay(){
  const o=cur?.order;if(!o)return;clearInterval(poll);
  await db.update('orders',o.id,{status:'pago'});await decStock(o.items);await reload();
  const r=await notify(o,true);
  showPaid(o,true);
  toast(r.ok?'📱 WhatsApp e 📧 e-mail de aviso enviados':'📱 WhatsApp enviado · 📧 e-mail não enviado: '+r.msg);
}
function startPoll(pid,oid,items){
  clearInterval(poll);
  poll=setInterval(async()=>{
    try{const s=await mp({action:'status',id:pid});
      if(s.status==='approved'){clearInterval(poll);await db.update('orders',oid,{status:'pago'});
        await decStock(items);await reload();if(cur?.order?.id==oid)notify(cur.order,false);
        if($('st')&&cur?.order?.id==oid)showPaid(cur.order)}
    }catch{}
  },4000);
}

const applyBrand=()=>{$('brand').textContent='🛍️ '+(cfg.storeName||'Minha Loja');document.title=cfg.storeName||'Minha Loja'};
async function reload(){products=await db.list('products');renderShop()}
(async()=>{
  if(!sb){$('shop').innerHTML='<p class="mu">Não foi possível conectar ao banco de dados. Recarregue a página.</p>';return}
  cfg=await db.getCfg();applyBrand();await reload();
})();
</script>
</body>
</html>
